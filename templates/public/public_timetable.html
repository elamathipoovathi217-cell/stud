{% extends 'base.html' %}{% block content %}<h3>Public Timetable</h3><table><tr><th>Date</th><th>Subject</th><th>Department</th></tr>{% for e in exams %}<tr><td>{{e.exam_date}}</td><td>{{e.subject.name if e.subject else '-'}}</td><td>{{e.subject.department.name if e.subject and e.subject.department else '-'}}</td></tr>{% else %}<tr><td colspan='3'>No exams.</td></tr>{% endfor %}</table>{% endblock %}
